name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check templates and Compose
        run: |
          python3 -m unittest discover -s tests -v
          docker compose -f deploy/compose.yaml config --quiet
          git diff --check
      - name: Install offline QR dependency
        run: python3 -m pip install -r requirements-local.txt
      - name: Validate pinned core and actual panel API
        env:
          VALIDATE_CORE: "1"
          RUN_PANEL_INTEGRATION: "1"
          RUN_PANEL_NETWORK: "1"
          RUN_PROBE_INTEGRATION: "1"
          RUN_CLIPROXY_INTEGRATION: "1"
        run: python3 -m unittest discover -s tests -v
